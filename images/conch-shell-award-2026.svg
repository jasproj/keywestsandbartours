  <text x="100" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="3" fill="#E87B4A" text-anchor="middle">2026</text>
  <text x="100" y="167" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" letter-spacing="2.2" fill="#FDF8F0" opacity=".85" text-anchor="middle">NOMINEE</text>
