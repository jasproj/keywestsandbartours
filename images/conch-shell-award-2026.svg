  <defs><path id="csa-arc" d="M100,100 m-71,0 a71,71 0 0 1 142,0" fill="none"/></defs>
  <circle cx="100" cy="100" r="97" fill="#1B3A57"/>
  <circle cx="100" cy="100" r="89" fill="none" stroke="#E87B4A" stroke-width="2.6"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#E87B4A" stroke-width="1" opacity=".5"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="12.5" letter-spacing="2.2" fill="#FDF8F0" text-anchor="middle">
    <textPath href="#csa-arc" startOffset="50%">CONCH SHELL AWARDS</textPath>
