    <path d="M-6,-19 C-11,-15 -14,-9 -14,-3"/>
    <path d="M-9,-12 C-11,-9 -12,-6 -11,-3"/>
    <path d="M-23,19 C-14,22 -2,21 6,15 C12,11 15,5 15,-1" stroke-width="2.4"/>
    <path d="M2,-21 C6,-12 7,-2 4,7 C2,14 -2,19 -7,22" stroke-width="2.2" opacity=".85"/>
  </g>
